<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f1">
<title>我们的小空间</title>
<style>
  html,body{margin:0;height:100%;background:#f3f4f1;color:#1b1f1c;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  #boot{display:flex;align-items:center;justify-content:center;height:100%;
    padding:24px;text-align:center;font-size:14px;line-height:1.7;color:#6e746e;white-space:pre-wrap}
</style>
</head>
<body>
<div id="boot">正在打开我们的小空间…</div>
<script>
(function () {
  var KEY = 'sister-habits-gist';
  var boot = document.getElementById('boot');
  var q = new URLSearchParams(location.search);
  var id = q.get('gist'), tk = q.get('gt') || q.get('gist_token');
  var cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { cfg = null; }
  if (id && tk) {
    cfg = { id: id, token: tk };
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  if (!cfg || !cfg.id || !cfg.token) {
    boot.textContent = '这个页面需要在网址后面带上参数才能使用。\n请用发给你的那条完整链接打开（形如 …?gist=编号&gt=令牌）。';
    return;
  }
  boot.textContent = '正在打开我们的小空间…';
  fetch('https://api.github.com/gists/' + cfg.id, {
    headers: { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' },
    cache: 'no-store',
  })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      var f = (j.files || {})['app.html'];
      if (!f) throw new Error('数据柜里还没有程序');
      if (f.truncated && f.raw_url) return fetch(f.raw_url, { cache: 'no-store' }).then(function (r) { return r.text(); });
      return f.content;
    })
    .then(function (html) {
      document.open(); document.write(html); document.close();
    })
    .catch(function (e) {
      boot.textContent = '打开失败：' + e.message + '\n\n点这里重试';
      boot.onclick = function () { location.reload(); };
    });
})();
</script>
</body>
</html>
